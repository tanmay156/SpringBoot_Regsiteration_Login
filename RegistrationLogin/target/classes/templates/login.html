<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Login</title>
</head>

<br>
<h2>Login</h2>

<div th:if="${errorMsg}">
	<h3 style="color: red;" th:text="${errorMsg}"></h3>
</div>

<form th:action="@{/loginForm}" th:object="${user}" method="post">
	<label for="email">Email:</label>
	<input type="email" th:field="*{email}" id="email" required><br /><br />

	<label for="password">Password:</label>
	<input type="password" th:field="*{password}" id="password" required><br /><br />

	<input type="submit" value="Login">
</form>

<br></br>

<a href="regPage">Register</a>
&nbsp;&nbsp;&nbsp;
<a href="index.html">Home</a>
</body>

</html>
